<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Tracker</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- jsPDF & docx.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js"></script>

  <style>
    /* Transisi halus saat toggle tema */
    body {
      transition: background-color 0.3s ease, color 0.3s ease;
    }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col font-sans antialiased min-w-[360px]">

  <!-- CONFIGURATION -->
  <script>
    // Config: Sesuaikan URL Web App Apps Script dan API Token Anda di sini
    const CONFIG = {
      API_URL: "https://script.google.com/macros/s/AKfycbykO2k8EM-Bb4ogVizUYQO88gjo6p0CogrLdmypdcvDw3DeZBwQPkopE-xQmc__eEE6/exec",
      API_TOKEN: "JobTracker2026Key"
    };
  </script>

  <!-- HEADER / NAVBAR -->
  <header class="border-b border-gray-800 bg-gray-900/80 backdrop-blur sticky top-0 z-30 dark:border-gray-800 dark:bg-gray-900/80 border-gray-200 bg-white/80 text-gray-900 dark:text-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-sky-500/10 text-sky-400 rounded-lg">
          <i data-lucide="briefcase" class="w-6 h-6"></i>
        </div>
        <h1 class="text-xl font-bold tracking-tight">Job Tracker</h1>
      </div>

      <div class="flex items-center gap-2 sm:gap-4">
        <!-- Export Menu Dropdown -->
        <div class="relative inline-block text-left">
          <button id="btnExportMenu" onclick="toggleExportDropdown()" class="flex items-center gap-1.5 px-3 py-2 text-sm font-medium rounded-lg border border-gray-700 dark:border-gray-700 border-gray-300 hover:bg-gray-800 dark:hover:bg-gray-800 hover:bg-gray-100 transition">
            <i data-lucide="download" class="w-4 h-4"></i>
            <span class="hidden sm:inline">Ekspor</span>
            <i data-lucide="chevron-down" class="w-4 h-4"></i>
          </button>
          <div id="exportDropdown" class="hidden absolute right-0 mt-2 w-44 rounded-md shadow-lg bg-white dark:bg-gray-800 ring-1 ring-black ring-opacity-5 z-40 border border-gray-200 dark:border-gray-700">
            <div class="py-1">
              <button onclick="exportData('pdf')" class="w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2">
                <i data-lucide="file-text" class="w-4 h-4 text-red-500"></i> Laporan PDF
              </button>
              <button onclick="exportData('docx')" class="w-full text-left px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center gap-2">
                <i data-lucide="file-spreadsheet" class="w-4 h-4 text-blue-500"></i> Laporan DOCX
              </button>
            </div>
          </div>
        </div>

        <!-- Tambah Lamaran Button -->
        <button onclick="openModal()" class="flex items-center gap-2 bg-sky-600 hover:bg-sky-500 text-white px-3 sm:px-4 py-2 rounded-lg text-sm font-medium transition shadow-sm">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span class="hidden sm:inline">Tambah Lamaran</span>
        </button>

        <!-- Toggle Theme Button -->
        <button id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-lg border border-gray-700 dark:border-gray-700 border-gray-300 hover:bg-gray-800 dark:hover:bg-gray-800 hover:bg-gray-100 transition text-gray-400 hover:text-gray-200">
          <i id="themeIcon" data-lucide="sun" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

    <!-- METRIC DASHBOARD -->
    <section class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
      <div class="p-4 rounded-xl border border-gray-800 dark:border-gray-800 border-gray-200 bg-gray-900/50 dark:bg-gray-900/50 bg-white">
        <p class="text-xs font-medium text-gray-400">Total Lamaran</p>
        <h3 id="metricTotal" class="text-2xl font-bold mt-2 text-gray-100 dark:text-gray-100 text-gray-900">0</h3>
      </div>
      <div class="p-4 rounded-xl border border-blue-900/40 bg-blue-950/20 dark:bg-blue-950/20 bg-blue-50/50">
        <p class="text-xs font-medium text-blue-400">Aktif</p>
        <h3 id="metricActive" class="text-2xl font-bold mt-2 text-blue-400">0</h3>
      </div>
      <div class="p-4 rounded-xl border border-purple-900/40 bg-purple-950/20 dark:bg-purple-950/20 bg-purple-50/50">
        <p class="text-xs font-medium text-purple-400">Interview</p>
        <h3 id="metricInterview" class="text-2xl font-bold mt-2 text-purple-400">0</h3>
      </div>
      <div class="p-4 rounded-xl border border-emerald-900/40 bg-emerald-950/20 dark:bg-emerald-950/20 bg-emerald-50/50">
        <p class="text-xs font-medium text-emerald-400">Offered</p>
        <h3 id="metricOffered" class="text-2xl font-bold mt-2 text-emerald-400">0</h3>
      </div>
      <div class="p-4 rounded-xl border border-rose-900/40 bg-rose-950/20 dark:bg-rose-950/20 bg-rose-50/50 col-span-2 sm:col-span-1">
        <p class="text-xs font-medium text-rose-400">Rejected</p>
        <h3 id="metricRejected" class="text-2xl font-bold mt-2 text-rose-400">0</h3>
      </div>
    </section>

    <!-- CONTROLS: SEARCH & FILTER -->
    <section class="flex flex-col sm:flex-row gap-4 justify-between items-stretch sm:items-center">
      <div class="relative flex-1">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
        <input type="text" id="searchInput" oninput="handleSearchFilter()" placeholder="Cari perusahaan atau posisi..." 
          class="w-full pl-9 pr-4 py-2 text-sm bg-gray-900 dark:bg-gray-900 bg-white border border-gray-800 dark:border-gray-800 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
      </div>
      
      <div class="flex items-center gap-3 flex-wrap sm:flex-nowrap">
        <select id="statusFilter" onchange="handleSearchFilter()" class="px-3 py-2 text-sm bg-gray-900 dark:bg-gray-900 bg-white border border-gray-800 dark:border-gray-800 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
          <option value="">Semua Status</option>
          <option value="Applied">Applied</option>
          <option value="Screening">Screening</option>
          <option value="Interview">Interview</option>
          <option value="Offered">Offered</option>
          <option value="Rejected">Rejected</option>
          <option value="Withdrawn">Withdrawn</option>
          <option value="Ghosted">Ghosted</option>
        </select>

        <label class="flex items-center gap-2 text-sm text-gray-400 dark:text-gray-400 text-gray-600 cursor-pointer select-none">
          <input type="checkbox" id="onlyActiveFilter" onchange="handleSearchFilter()" class="rounded border-gray-700 text-sky-600 focus:ring-sky-500 w-4 h-4">
          Hanya Aktif
        </label>
      </div>
    </section>

    <!-- CONTENT AREA -->
    <section>
      <!-- Loading State -->
      <div id="loadingState" class="py-12 flex flex-col items-center justify-center text-gray-500 space-y-3">
        <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-sky-500"></i>
        <p class="text-sm">Memuat data lamaran...</p>
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="hidden py-16 text-center border border-dashed border-gray-800 dark:border-gray-800 border-gray-300 rounded-xl">
        <i data-lucide="inbox" class="w-12 h-12 mx-auto text-gray-600 mb-3"></i>
        <h3 class="text-base font-semibold text-gray-300 dark:text-gray-300 text-gray-700">Belum ada lamaran</h3>
        <p class="text-sm text-gray-500 mt-1">Mulai catat lamaran pekerjaan pertama Anda.</p>
        <button onclick="openModal()" class="mt-4 px-4 py-2 text-sm bg-sky-600 hover:bg-sky-500 text-white rounded-lg transition">Tambah Lamaran</button>
      </div>

      <!-- Table View (Desktop) -->
      <div id="tableView" class="hidden md:block overflow-x-auto rounded-xl border border-gray-800 dark:border-gray-800 border-gray-200">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-800/50 dark:bg-gray-800/50 bg-gray-100 text-gray-400 border-b border-gray-800 dark:border-gray-800 border-gray-200">
            <tr>
              <th class="py-3 px-4 w-12 text-center">No</th>
              <th class="py-3 px-4">Perusahaan</th>
              <th class="py-3 px-4">Posisi</th>
              <th class="py-3 px-4">Status</th>
              <th class="py-3 px-4">Tanggal Melamar</th>
              <th class="py-3 px-4">Terakhir Diperbarui</th>
              <th class="py-3 px-4 text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="tableBody" class="divide-y divide-gray-800 dark:divide-gray-800 divide-gray-200">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>

      <!-- Mobile List View -->
      <div id="mobileListView" class="block md:hidden space-y-4">
        <!-- Dynamic mobile cards -->
      </div>
    </section>
  </main>

  <!-- FORM MODAL (CREATE & EDIT) -->
  <div id="appModal" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-gray-900 dark:bg-gray-900 bg-white border border-gray-800 dark:border-gray-800 border-gray-200 rounded-xl w-full max-w-lg overflow-hidden shadow-2xl">
      <div class="px-6 py-4 border-b border-gray-800 dark:border-gray-800 border-gray-200 flex justify-between items-center">
        <h3 id="modalTitle" class="text-lg font-bold text-gray-100 dark:text-gray-100 text-gray-900">Tambah Lamaran Baru</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-200"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <form id="jobForm" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4 text-sm">
        <input type="hidden" id="formIdUnik">

        <div>
          <label class="block mb-1 text-gray-300 dark:text-gray-300 text-gray-700 font-medium">Nama Perusahaan <span class="text-rose-500">*</span></label>
          <input type="text" id="formNamaPerusahaan" required maxlength="100" class="w-full px-3 py-2 bg-gray-800 dark:bg-gray-800 bg-gray-50 border border-gray-700 dark:border-gray-700 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>

        <div>
          <label class="block mb-1 text-gray-300 dark:text-gray-300 text-gray-700 font-medium">Posisi <span class="text-rose-500">*</span></label>
          <input type="text" id="formPosisi" required maxlength="100" class="w-full px-3 py-2 bg-gray-800 dark:bg-gray-800 bg-gray-50 border border-gray-700 dark:border-gray-700 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block mb-1 text-gray-300 dark:text-gray-300 text-gray-700 font-medium">Tanggal Melamar <span class="text-rose-500">*</span></label>
            <input type="date" id="formTanggalMelamar" required class="w-full px-3 py-2 bg-gray-800 dark:bg-gray-800 bg-gray-50 border border-gray-700 dark:border-gray-700 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
          <div>
            <label class="block mb-1 text-gray-300 dark:text-gray-300 text-gray-700 font-medium">Status <span class="text-rose-500">*</span></label>
            <select id="formStatus" required class="w-full px-3 py-2 bg-gray-800 dark:bg-gray-800 bg-gray-50 border border-gray-700 dark:border-gray-700 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
              <option value="Applied">Applied</option>
              <option value="Screening">Screening</option>
              <option value="Interview">Interview</option>
              <option value="Offered">Offered</option>
              <option value="Rejected">Rejected</option>
              <option value="Withdrawn">Withdrawn</option>
              <option value="Ghosted">Ghosted</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block mb-1 text-gray-300 dark:text-gray-300 text-gray-700 font-medium">Tautan Lowongan</label>
          <input type="url" id="formTautanLowongan" placeholder="https://..." class="w-full px-3 py-2 bg-gray-800 dark:bg-gray-800 bg-gray-50 border border-gray-700 dark:border-gray-700 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block mb-1 text-gray-300 dark:text-gray-300 text-gray-700 font-medium">Sumber Lowongan</label>
            <input type="text" id="formSumberLowongan" placeholder="LinkedIn, Glints, dll" maxlength="50" class="w-full px-3 py-2 bg-gray-800 dark:bg-gray-800 bg-gray-50 border border-gray-700 dark:border-gray-700 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
          <div>
            <label class="block mb-1 text-gray-300 dark:text-gray-300 text-gray-700 font-medium">Gaji (IDR)</label>
            <input type="number" id="formGaji" min="0" placeholder="8500000" class="w-full px-3 py-2 bg-gray-800 dark:bg-gray-800 bg-gray-50 border border-gray-700 dark:border-gray-700 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500">
          </div>
        </div>

        <div>
          <label class="block mb-1 text-gray-300 dark:text-gray-300 text-gray-700 font-medium">Catatan</label>
          <textarea id="formCatatan" rows="3" maxlength="1000" placeholder="Catatan proses rekrutmen..." class="w-full px-3 py-2 bg-gray-800 dark:bg-gray-800 bg-gray-50 border border-gray-700 dark:border-gray-700 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-sky-500"></textarea>
        </div>

        <div id="formError" class="hidden text-xs text-rose-400 bg-rose-950/40 p-2.5 rounded border border-rose-900/50"></div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-800 dark:border-gray-800 border-gray-200">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-700 rounded-lg text-gray-300 hover:bg-gray-800 transition">Batal</button>
          <button type="submit" id="btnSubmitForm" class="px-4 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg transition flex items-center gap-2">
            <span>Simpan</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- APPLICATION LOGIC -->
  <script>
    let rawApplications = [];
    let filteredApplications = [];
    const ACTIVE_STATUSES = ['Applied', 'Screening', 'Interview'];

    // Inisialisasi Aplikasi
    document.addEventListener("DOMContentLoaded", () => {
      initTheme();
      lucide.createIcons();
      fetchApplications();
    });

    // Theme Handler
    function initTheme() {
      const savedTheme = localStorage.getItem('jobtracker.theme') || 'dark';
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeIcon').setAttribute('data-lucide', 'moon');
      } else {
        document.documentElement.classList.add('dark');
        document.getElementById('themeIcon').setAttribute('data-lucide', 'sun');
      }
      lucide.createIcons();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('jobtracker.theme', isDark ? 'dark' : 'light');
      document.getElementById('themeIcon').setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      lucide.createIcons();
    }

    // Fetch Data dari GAS Backend
    async function fetchApplications() {
      showLoading(true);
      try {
        const url = `${CONFIG.API_URL}?action=list&token=${encodeURIComponent(CONFIG.API_TOKEN)}`;
        const res = await fetch(url);
        const json = await res.json();

        if (json.success) {
          rawApplications = json.data;
          handleSearchFilter();
        } else {
          showError("Gagal mengambil data: " + (json.message || json.error));
        }
      } catch (err) {
        showError("Gagal terhubung ke server. Periksa konfigurasi API_URL.");
      } finally {
        showLoading(false);
      }
    }

    // Filter & Search Logic
    function handleSearchFilter() {
      const search = document.getElementById('searchInput').value.toLowerCase().trim();
      const status = document.getElementById('statusFilter').value;
      const onlyActive = document.getElementById('onlyActiveFilter').checked;

      filteredApplications = rawApplications.filter(app => {
        const matchSearch = app.namaPerusahaan.toLowerCase().includes(search) || app.posisi.toLowerCase().includes(search);
        const matchStatus = status ? app.status === status : true;
        const matchActive = onlyActive ? ACTIVE_STATUSES.includes(app.status) : true;
        return matchSearch && matchStatus && matchActive;
      });

      renderDashboard();
      renderList();
    }

    // Render Dashboard Metrics
    function renderDashboard() {
      document.getElementById('metricTotal').textContent = rawApplications.length;
      document.getElementById('metricActive').textContent = rawApplications.filter(a => ACTIVE_STATUSES.includes(a.status)).length;
      document.getElementById('metricInterview').textContent = rawApplications.filter(a => a.status === 'Interview').length;
      document.getElementById('metricOffered').textContent = rawApplications.filter(a => a.status === 'Offered').length;
      document.getElementById('metricRejected').textContent = rawApplications.filter(a => a.status === 'Rejected').length;
    }

    // Render Table & Mobile Cards
    function renderList() {
      const tbody = document.getElementById('tableBody');
      const mobileList = document.getElementById('mobileListView');
      const emptyState = document.getElementById('emptyState');
      const tableView = document.getElementById('tableView');

      tbody.innerHTML = '';
      mobileList.innerHTML = '';

      if (filteredApplications.length === 0) {
        emptyState.classList.remove('hidden');
        tableView.classList.add('hidden');
        mobileList.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      tableView.classList.remove('hidden');
      mobileList.classList.remove('hidden');

      filteredApplications.forEach((app, index) => {
        const isFollowUp = isNeedsFollowUp(app);
        const formattedDate = formatDateLocal(app.tanggalMelamar);
        const formattedUpdated = formatDateLocal(app.terakhirDiperbarui.substring(0, 10));

        // Desktop Row
        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-800/30 dark:hover:bg-gray-800/30 hover:bg-gray-50 transition border-b border-gray-800 dark:border-gray-800 border-gray-200";
        tr.innerHTML = `
          <td class="py-3 px-4 text-center text-gray-500">${index + 1}</td>
          <td class="py-3 px-4 font-semibold">
            <div class="flex items-center gap-2">
              <span>${escapeHtml(app.namaPerusahaan)}</span>
              ${app.tautanLowongan ? `<a href="${escapeHtml(app.tautanLowongan)}" target="_blank" class="text-sky-400 hover:text-sky-300"><i data-lucide="external-link" class="w-3.5 h-3.5"></i></a>` : ''}
            </div>
          </td>
          <td class="py-3 px-4">${escapeHtml(app.posisi)}</td>
          <td class="py-3 px-4">
            ${getStatusBadge(app.status)}
            ${isFollowUp ? `<span class="ml-2 inline-flex items-center text-xs text-amber-400 bg-amber-950/50 border border-amber-800/50 px-2 py-0.5 rounded-full"><i data-lucide="clock" class="w-3 h-3 mr-1"></i> Perlu follow up</span>` : ''}
          </td>
          <td class="py-3 px-4 text-gray-400 dark:text-gray-400 text-gray-600">${formattedDate}</td>
          <td class="py-3 px-4 text-gray-400 dark:text-gray-400 text-gray-600">${formattedUpdated}</td>
          <td class="py-3 px-4 text-right">
            <div class="flex items-center justify-end gap-2">
              <button onclick="openModal('${app.idUnik}')" class="p-1.5 text-gray-400 hover:text-sky-400 rounded"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
              <button onclick="deleteApplication('${app.idUnik}')" class="p-1.5 text-gray-400 hover:text-rose-400 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);

        // Mobile Card
        const card = document.createElement('div');
        card.className = "p-4 rounded-xl border border-gray-800 dark:border-gray-800 border-gray-200 bg-gray-900/50 dark:bg-gray-900/50 bg-white space-y-3";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h4 class="font-bold text-base flex items-center gap-1.5">
                ${escapeHtml(app.namaPerusahaan)}
                ${app.tautanLowongan ? `<a href="${escapeHtml(app.tautanLowongan)}" target="_blank" class="text-sky-400"><i data-lucide="external-link" class="w-3.5 h-3.5"></i></a>` : ''}
              </h4>
              <p class="text-sm text-gray-400 dark:text-gray-400 text-gray-600">${escapeHtml(app.posisi)}</p>
            </div>
            ${getStatusBadge(app.status)}
          </div>
          ${isFollowUp ? `<div class="inline-flex items-center text-xs text-amber-400 bg-amber-950/50 border border-amber-800/50 px-2 py-1 rounded-md"><i data-lucide="clock" class="w-3.5 h-3.5 mr-1"></i> Perlu follow up (>14 hari)</div>` : ''}
          <div class="text-xs text-gray-500 space-y-1 pt-2 border-t border-gray-800 dark:border-gray-800 border-gray-100">
            <div>Tanggal Melamar: <span class="text-gray-300 dark:text-gray-300 text-gray-700">${formattedDate}</span></div>
            <div>Terakhir Diperbarui: <span class="text-gray-300 dark:text-gray-300 text-gray-700">${formattedUpdated}</span></div>
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="openModal('${app.idUnik}')" class="px-3 py-1.5 text-xs border border-gray-700 rounded-md text-sky-400 flex items-center gap-1"><i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Edit</button>
            <button onclick="deleteApplication('${app.idUnik}')" class="px-3 py-1.5 text-xs border border-gray-700 rounded-md text-rose-400 flex items-center gap-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Hapus</button>
          </div>
        `;
        mobileList.appendChild(card);
      });

      lucide.createIcons();
    }

    // Modal Control & Form Handling
    function openModal(idUnik = null) {
      const modal = document.getElementById('appModal');
      const title = document.getElementById('modalTitle');
      const form = document.getElementById('jobForm');
      document.getElementById('formError').classList.add('hidden');

      form.reset();
      document.getElementById('formIdUnik').value = idUnik || '';

      if (idUnik) {
        title.textContent = "Edit Lamaran Pekerjaan";
        const app = rawApplications.find(a => a.idUnik === idUnik);
        if (app) {
          document.getElementById('formNamaPerusahaan').value = app.namaPerusahaan;
          document.getElementById('formPosisi').value = app.posisi;
          document.getElementById('formTanggalMelamar').value = app.tanggalMelamar;
          document.getElementById('formStatus').value = app.status;
          document.getElementById('formTautanLowongan').value = app.tautanLowongan || '';
          document.getElementById('formSumberLowongan').value = app.sumberLowongan || '';
          document.getElementById('formGaji').value = app.gaji || '';
          document.getElementById('formCatatan').value = app.catatan || '';
        }
      } else {
        title.textContent = "Tambah Lamaran Baru";
        document.getElementById('formTanggalMelamar').value = new Date().toISOString().split('T')[0];
        document.getElementById('formStatus').value = 'Applied';
      }

      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('appModal').classList.add('hidden');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const idUnik = document.getElementById('formIdUnik').value;
      const isEdit = !!idUnik;

      const payloadData = {
        namaPerusahaan: document.getElementById('formNamaPerusahaan').value.trim(),
        posisi: document.getElementById('formPosisi').value.trim(),
        tanggalMelamar: document.getElementById('formTanggalMelamar').value,
        status: document.getElementById('formStatus').value,
        tautanLowongan: document.getElementById('formTautanLowongan').value.trim(),
        sumberLowongan: document.getElementById('formSumberLowongan').value.trim(),
        gaji: document.getElementById('formGaji').value ? parseInt(document.getElementById('formGaji').value) : "",
        catatan: document.getElementById('formCatatan').value.trim()
      };

      // Peringatan Duplikat untuk Insert Baru
      if (!isEdit) {
        const exists = rawApplications.some(a => 
          a.namaPerusahaan.toLowerCase() === payloadData.namaPerusahaan.toLowerCase() &&
          a.posisi.toLowerCase() === payloadData.posisi.toLowerCase() &&
          a.tanggalMelamar === payloadData.tanggalMelamar
        );
        if (exists) {
          if (!confirm("Lamaran dengan Perusahaan, Posisi, dan Tanggal Melamar yang sama sudah ada. Tetap simpan?")) {
            return;
          }
        }
      }

      const body = {
        token: CONFIG.API_TOKEN,
        action: isEdit ? 'update' : 'create',
        ...(isEdit && { idUnik: idUnik }),
        data: payloadData
      };

      const btnSubmit = document.getElementById('btnSubmitForm');
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Menyimpan...`;
      lucide.createIcons();

      try {
        const res = await fetch(CONFIG.API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        });
        const json = await res.json();

        if (json.success) {
          closeModal();
          await fetchApplications();
        } else {
          showFormError(json.message || "Gagal menyimpan data.");
        }
      } catch (err) {
        showFormError("Terjadi kesalahan jaringan.");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Simpan</span>`;
      }
    }

    async function deleteApplication(idUnik) {
      if (!confirm("Apakah Anda yakin ingin menghapus lamaran ini secara permanen?")) return;

      try {
        const body = {
          token: CONFIG.API_TOKEN,
          action: 'delete',
          idUnik: idUnik
        };

        const res = await fetch(CONFIG.API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body)
        });
        const json = await res.json();

        if (json.success) {
          await fetchApplications();
        } else {
          alert("Gagal menghapus: " + (json.message || json.error));
        }
      } catch (err) {
        alert("Gagal koneksi ke server saat menghapus.");
      }
    }

    // Export Logic
    function toggleExportDropdown() {
      document.getElementById('exportDropdown').classList.toggle('hidden');
    }

    function exportData(type) {
      toggleExportDropdown();
      if (type === 'pdf') exportPDF();
      if (type === 'docx') exportDOCX();
    }

    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("Laporan Ringkasan Job Application Tracker", 14, 20);

      doc.setFontSize(10);
      doc.text(`Tanggal Ekspor: ${new Date().toLocaleDateString('id-ID')}`, 14, 28);
      doc.text(`Total Data: ${filteredApplications.length}`, 14, 34);

      let y = 45;
      doc.setFontSize(10);
      doc.setFont("helvetica", "bold");
      doc.text("Perusahaan", 14, y);
      doc.text("Posisi", 65, y);
      doc.text("Status", 120, y);
      doc.text("Tanggal", 160, y);

      doc.line(14, y + 2, 195, y + 2);
      doc.setFont("helvetica", "normal");
      y += 8;

      filteredApplications.forEach(app => {
        if (y > 280) {
          doc.addPage();
          y = 20;
        }
        doc.text(app.namaPerusahaan.substring(0, 22), 14, y);
        doc.text(app.posisi.substring(0, 22), 65, y);
        doc.text(app.status, 120, y);
        doc.text(app.tanggalMelamar, 160, y);
        y += 7;
      });

      doc.save(`Job_Applications_${new Date().toISOString().substring(0, 10)}.pdf`);
    }

    async function exportDOCX() {
      const { Document, Packer, Paragraph, Table, TableRow, TableCell, TextRun, WidthType } = window.docx;

      const rows = [
        new TableRow({
          children: [
            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Perusahaan", bold: true })] })] }),
            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Posisi", bold: true })] })] }),
            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Status", bold: true })] })] }),
            new TableCell({ children: [new Paragraph({ children: [new TextRun({ text: "Tanggal Melamar", bold: true })] })] }),
          ]
        }),
        ...filteredApplications.map(app => new TableRow({
          children: [
            new TableCell({ children: [new Paragraph(app.namaPerusahaan)] }),
            new TableCell({ children: [new Paragraph(app.posisi)] }),
            new TableCell({ children: [new Paragraph(app.status)] }),
            new TableCell({ children: [new Paragraph(app.tanggalMelamar)] }),
          ]
        }))
      ];

      const table = new Table({
        width: { size: 100, type: WidthType.PERCENTAGE },
        rows: rows
      });

      const doc = new Document({
        sections: [{
          children: [
            new Paragraph({
              children: [new TextRun({ text: "Laporan Job Application Tracker", bold: true, size: 32 })]
            }),
            new Paragraph({
              children: [new TextRun({ text: `Tanggal Ekspor: ${new Date().toLocaleDateString('id-ID')}\n\n` })]
            }),
            table
          ]
        }]
      });

      const blob = await Packer.toBlob(doc);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Job_Applications_${new Date().toISOString().substring(0, 10)}.docx`;
      a.click();
    }

    // Helper Functions
    function isNeedsFollowUp(app) {
      if (!ACTIVE_STATUSES.includes(app.status)) return false;
      const updatedDate = new Date(app.terakhirDiperbarui);
      const diffTime = Math.abs(new Date() - updatedDate);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
      return diffDays > 14;
    }

    function getStatusBadge(status) {
      const styles = {
        'Applied': 'bg-blue-950/60 text-blue-400 border-blue-800/60',
        'Screening': 'bg-amber-950/60 text-amber-400 border-amber-800/60',
        'Interview': 'bg-purple-950/60 text-purple-400 border-purple-800/60',
        'Offered': 'bg-emerald-950/60 text-emerald-400 border-emerald-800/60',
        'Rejected': 'bg-rose-950/60 text-rose-400 border-rose-800/60',
        'Withdrawn': 'bg-gray-800 text-gray-400 border-gray-700',
        'Ghosted': 'bg-zinc-800 text-zinc-400 border-zinc-700'
      };
      return `<span class="px-2.5 py-0.5 text-xs rounded-full border ${styles[status] || styles['Applied']}">${status}</span>`;
    }

    function formatDateLocal(dateStr) {
      if (!dateStr) return '-';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const date = new Date(parts[0], parts[1] - 1, parts[2]);
      return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function showLoading(show) {
      document.getElementById('loadingState').classList.toggle('hidden', !show);
    }

    function showFormError(msg) {
      const errBox = document.getElementById('formError');
      errBox.textContent = msg;
      errBox.classList.remove('hidden');
    }

    function showError(msg) {
      alert(msg);
    }
  </script>
